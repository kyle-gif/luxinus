<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Hidden decode window CSP. Unlike the UI window (connect-src 'none'), this
      window must fetch its OWN wasm from its OWN origin, so connect-src 'self'.
      'wasm-unsafe-eval' permits WebAssembly compilation without allowing JS eval.
      Still strictly local: 'self' only — no external host can be reached.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Luxinus decoder</title>
  </head>
  <body>
    <script type="module" src="/src/decoder/decoder.ts"></script>
  </body>
</html>
