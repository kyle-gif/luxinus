<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Hidden decode window loads its bundled wasm from its own origin.
      'wasm-unsafe-eval' permits WebAssembly compilation without JS eval.
      Connections remain available; image decoding needs only local resources.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Luxinus decoder</title>
  </head>
  <body>
    <script type="module" src="/src/decoder/decoder.ts"></script>
  </body>
</html>
